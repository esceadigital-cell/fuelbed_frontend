<!-- public/offline.html -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Downloaded Guides</title>
        <style>
            @font-face {
                font-family: "Die Grotesk";
                src: url("/fonts/die-grotesk-b-regular.woff2") format("woff2");
                font-weight: 400;
                font-style: normal;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                font-size: 62.5%; /* 1rem = 10px, same as the site */
            }
            body {
                font-family: "Die Grotesk", sans-serif;
                padding: 1rem; /* $padding-mobile */
                background-color: #fbf9f7; /* $color-light */
                color: #141414; /* $color-dark */
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .header {
                height: 3rem;
                display: flex;
                align-items: center;
            }
            h1 {
                /* h1-styles */
                font-size: 2rem;
                letter-spacing: 0.1rem;
                font-weight: normal;
            }
            p {
                /* p-styles */
                font-size: 1.5rem;
                letter-spacing: 0.1rem;
                line-height: 2rem;
            }
            a {
                text-decoration: none;
                color: #141414;
            }
            .logo {
                max-width: 60px;
            }

            /* DOWNLOADED GUIDES DROPDOWN */
            .downloadedGuidesWrapper {
                display: flex;
                flex-direction: column;
                position: relative;
            }
            .dropDownTopBar {
                /* btnStyles */
                background-color: transparent;
                border: 1px solid #edeceb;
                border-radius: 0.4rem;
                font-size: 1.3rem;
                letter-spacing: 0.1rem;
                /* overrides from ClientFilter */
                padding: 0.2rem 0.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                width: 100%;
                font-family: inherit;
                color: inherit;
                cursor: pointer;
            }
            .downloadedGuidesHeading {
                font-size: 1.3rem;
                letter-spacing: 0.1rem;
            }
            .arrowIconWrapper {
                display: flex;
            }
            .arrowIconWrapper.isOpen {
                transform: rotate(180deg);
            }
            .downloadedGuidesList {
                position: absolute;
                top: 100%;
                width: 100%;
                max-height: 40rem;
                overflow-y: auto;
                padding: 2.5rem 1rem;
                list-style: none;
                background-color: #edeceb; /* $color-grey */
                border: 1px solid rgba(20, 20, 20, 0.5);
                border-radius: 0.4rem;
                display: flex;
                flex-direction: column;
                gap: 2.5rem;
            }
            .downloadedGuidesList[hidden] {
                display: none;
            }
            .downloadedGuidesList li {
                /* p-styles */
                font-size: 1.5rem;
                letter-spacing: 0.1rem;
                line-height: 2rem;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <a href="/">
                <img class="logo" src="/icons/escea_logo_orange.svg" alt="Escea Fireplaces" />
            </a>
        </div>
        <h1>Looks like you are offline</h1>
        <p>Access your downloaded fuelbed installation guides</p>

        <div class="downloadedGuidesWrapper" id="dropdown" hidden>
            <button class="dropDownTopBar" id="toggle" aria-expanded="false">
                <span class="downloadedGuidesHeading">Downloaded guides</span>
                <span class="arrowIconWrapper" id="arrow">
                    <img src="/icons/chevron_down.png" alt="" width="30" height="30" />
                </span>
            </button>
            <ul class="downloadedGuidesList" id="list" hidden></ul>
        </div>

        <p id="empty" hidden>No guides downloaded yet</p>

        <script>
            async function renderGuides() {
                const stored = JSON.parse(localStorage.getItem("downloadedGuides") || "[]");

                // only keep guides that are still in the cache
                const stillCached = await Promise.all(
                    stored.map((g) => caches.has(`guide-${g.id}`)),
                );
                const guides = stored.filter((_, i) => stillCached[i]);

                // clean up localStorage if some were removed
                if (guides.length !== stored.length) {
                    localStorage.setItem("downloadedGuides", JSON.stringify(guides));
                }

                if (guides.length === 0) {
                    document.getElementById("empty").hidden = false;
                    return;
                }

                const list = document.getElementById("list");

                guides.forEach((g) => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    const params = new URLSearchParams({ modelTitle: g.modelTitle });
                    if (g.versionTitle) params.set("versionTitle", g.versionTitle);
                    if (g.fuelbedTitle) params.set("fuelbed", g.fuelbedTitle);

                    a.href = `/guide/${g.id}?${params.toString()}`;
                    a.textContent = [g.modelTitle, g.versionTitle, g.fuelbedTitle]
                        .filter(Boolean)
                        .join(" - ");
                    li.appendChild(a);
                    list.appendChild(li);
                });

                document.getElementById("dropdown").hidden = false;
            }

            // open and close the dropdown
            document.getElementById("toggle").addEventListener("click", () => {
                const list = document.getElementById("list");
                const isOpen = list.hidden; // hidden now means it's about to open
                list.hidden = !isOpen;
                document.getElementById("arrow").classList.toggle("isOpen", isOpen);
                document.getElementById("toggle").setAttribute("aria-expanded", String(isOpen));
            });

            renderGuides();
        </script>
    </body>
</html>
